# Producción local (reverse proxy en el host: nginx, Caddy, etc.)
# Uso: docker compose -f docker-compose.prod.yml up --build -d
services:
  strapi:
    container_name: strapi
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        STRAPI_ADMIN_BACKEND_URL: ${PUBLIC_URL}
    image: strapi:latest
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL}
      PROXY: "true"
      DATABASE_HOST: strapiDB
      DATABASE_PORT: 5432
    ports:
      - "127.0.0.1:${PORT:-1337}:1337"
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    networks:
      - strapi
    depends_on:
      strapiDB:
        condition: service_healthy

  strapiDB:
    container_name: strapiDB
    image: postgres:18
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql
    networks:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  strapi-data:
  strapi-uploads:

networks:
  strapi:
    name: strapi
    driver: bridge
